name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # Official pgvector image required for V10 migration
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ultimate
          POSTGRES_PASSWORD: ultimate
          POSTGRES_DB: ultimate

      
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Java 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x server/mvnw

      - name: Build pinned ImageMagick 7 for native tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libjpeg-dev libpng-dev libwebp-dev liblcms2-dev zlib1g-dev
          git clone --depth 1 --branch 7.1.2-34 https://github.com/ImageMagick/ImageMagick.git "$RUNNER_TEMP/imagemagick-source"
          cd "$RUNNER_TEMP/imagemagick-source"
          test "$(git rev-parse HEAD)" = a0c4bf729a26a5c2feb28b0365b47a8db736078a
          ./configure --prefix="$RUNNER_TEMP/imagemagick" --disable-shared --without-perl --without-x --disable-openmp
          make -j2
          make install
          "$RUNNER_TEMP/imagemagick/bin/magick" -version
          echo "$RUNNER_TEMP/imagemagick/bin" >> "$GITHUB_PATH"

      - name: Build and test
        working-directory: server
        run: ./mvnw -Dultimate.imagemagick.required=true clean verify
        env:
          DATABASE_URL: r2dbc:postgresql://localhost:5432/Ultimate
          FLYWAY_URL: jdbc:postgresql://localhost:5432/Ultimate
          DATABASE_USERNAME: ultimate
          DATABASE_PASSWORD: ultimate
          Ultimate_JWT_SECRET: test-secret-key-minimum-32-chars-long-enough
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: server/target/surefire-reports/
          if-no-files-found: warn
